services:
  postgres:
    image: postgres:16.0-alpine3.18
    container_name: postgres-sql-ace-player
    env_file:
      - .env.development
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - spring-demo
    restart: unless-stopped
  mail-dev:
    container_name: mail-dev-bsn
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
  aceplayer-api:
    container_name: aceplayer-api
    image: aceplayer/aceplayer:1.0.0
    ports:
      - 8088:8088
    networks:
      - spring-demo
    depends_on:
      - postgres

networks:
  spring-demo:
    driver: bridge

volumes:
  postgres:
    driver: local