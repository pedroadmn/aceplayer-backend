spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_LOCAL_PORT:5433}/${POSTGRES_DB:aceplayerdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${AP_MAIL_HOST:localhost}
    port: ${AP_MAIL_PORT:1025}
    username: ${AP_MAIL_USERNAME:aceplayer}
    password: ${AP_MAIL_PASSWORD:aceplayer}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
          starttls:
            enable: true
    protocol: smtp

application:
  security:
    token:
      secret-key: '${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}'
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days
  mailing:
    frontend:
      activation-url: http://localhost:4200/activate-account

server:
  port: 8088